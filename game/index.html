<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Pact — a duel of elemental cards</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="table">
  <header id="topbar">
    <div class="brand"><span class="flame">🔥</span> EMBER PACT</div>
    <div class="topinfo">
      <span id="roundLabel">Round 1</span>
      <span id="deckLabel">Deck 30</span>
      <button id="muteBtn" type="button" title="Mute (M)">🔊 Sound</button>
      <button id="helpBtn" type="button" title="How to play (H)">? Rules</button>
    </div>
  </header>

  <section id="foeZone" class="zone">
    <div class="fighter" id="foeFighter">
      <div class="portrait foe-portrait">🧙‍♀️</div>
      <div class="fighter-info">
        <div class="fighter-name">MIRA, THE EMBER WITCH <span id="foeTell" class="tell"></span></div>
        <div class="hpbar"><div id="foeHpFill" class="hpfill foe"></div><span id="foeHpText" class="hptext">30 / 30</span></div>
        <div id="foeStatus" class="statusline"></div>
      </div>
      <div id="foeScore" class="wins">Rounds won: 0</div>
    </div>
    <div id="foeHand" class="hand foe-hand" aria-label="Mira's hand"></div>
  </section>

  <section id="arena" aria-label="Duel arena">
    <div id="playedFoe" class="played-slot"><span class="slot-hint">Mira plays here</span></div>
    <div id="versus">
      <div id="clashLabel">VS</div>
      <div id="clashDetail">Pick a card to duel</div>
      <div id="chainLabel"></div>
    </div>
    <div id="playedYou" class="played-slot"><span class="slot-hint">You play here</span></div>
  </section>

  <div id="log" aria-live="polite"></div>

  <section id="youZone" class="zone">
    <div class="fighter" id="youFighter">
      <div class="portrait you-portrait">🛡️</div>
      <div class="fighter-info">
        <div class="fighter-name">YOU, WARDEN OF THE PACT</div>
        <div class="hpbar"><div id="youHpFill" class="hpfill you"></div><span id="youHpText" class="hptext">30 / 30</span></div>
        <div id="youStatus" class="statusline"></div>
      </div>
      <div id="youScore" class="wins">Rounds won: 0</div>
    </div>
    <div id="youHand" class="hand you-hand" aria-label="Your hand"></div>
    <div id="hint">Click a card, or press 1–5, then Enter to play it. Same element twice in a row builds a Chain (+2).</div>
  </section>

  <div id="overlay" class="hidden">
    <div id="overlayCard">
      <div id="overlayKicker"></div>
      <h1 id="overlayTitle"></h1>
      <p id="overlayText"></p>
      <div id="overlayStats"></div>
      <button id="overlayBtn" type="button">Play again</button>
    </div>
  </div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
